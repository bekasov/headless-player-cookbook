<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22303A"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07A12"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#22303A">Что внутри SoC: блоки на одном кристалле</text>
  <text x="24" y="58" font-size="13" fill="#5B6770">На примере H616. Все блоки работают с одной общей памятью; кадр переходит от блока к блоку через неё</text>

  <!-- кристалл -->
  <rect x="24" y="80" width="852" height="250" rx="10" fill="#EEF0F2" stroke="#5B6770" stroke-width="1.5"/>
  <text x="40" y="104" font-size="14" font-weight="700" fill="#22303A">SoC Allwinner H616 (один кристалл)</text>

  <g font-size="12" fill="#22303A" text-anchor="middle">
    <rect x="40" y="120" width="190" height="86" rx="6" fill="#E3ECF4" stroke="#34607F" stroke-width="1.5"/>
    <text x="135" y="144" font-size="14" font-weight="700">Процессор (CPU)</text>
    <text x="135" y="164">4 ядра Cortex-A53</text>
    <text x="135" y="182">Linux, программы,</text>
    <text x="135" y="198">демультиплексор, звук</text>

    <rect x="248" y="120" width="190" height="86" rx="6" fill="#E3F1EA" stroke="#2E6B4F" stroke-width="1.5"/>
    <text x="343" y="144" font-size="14" font-weight="700">Видеодвижок (VPU)</text>
    <text x="343" y="164">декодирует H.265/H.264</text>
    <text x="343" y="182">драйвер Cedrus</text>
    <text x="343" y="198" font-family="DejaVu Sans Mono, monospace" font-size="11">/dev/video0</text>

    <rect x="456" y="120" width="190" height="86" rx="6" fill="#F7EDD8" stroke="#B07A12" stroke-width="1.5"/>
    <text x="551" y="144" font-size="14" font-weight="700">GPU Mali-G31</text>
    <text x="551" y="164">рисует и смешивает</text>
    <text x="551" y="182">драйвер Panfrost</text>
    <text x="551" y="198" font-family="DejaVu Sans Mono, monospace" font-size="11">/dev/dri/renderD128</text>

    <rect x="664" y="120" width="196" height="86" rx="6" fill="#F3E3E3" stroke="#A33A3A" stroke-width="1.5"/>
    <text x="762" y="144" font-size="14" font-weight="700">Дисплейный движок</text>
    <text x="762" y="164">слои-плоскости → HDMI</text>
    <text x="762" y="182">драйвер sun4i-drm</text>
    <text x="762" y="198" font-family="DejaVu Sans Mono, monospace" font-size="11">/dev/dri/card0</text>

    <rect x="40" y="226" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
    <text x="135" y="250" font-weight="700">Звук</text>
    <text x="135" y="268">аудиокодек, звук по HDMI</text>

    <rect x="248" y="226" width="398" height="56" rx="6" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
    <text x="447" y="250" font-weight="700">Контроллер памяти</text>
    <text x="447" y="268">одна общая память для всех блоков</text>

    <rect x="664" y="226" width="196" height="56" rx="6" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
    <text x="762" y="250" font-weight="700">Периферия</text>
    <text x="762" y="268">карта, USB, Ethernet</text>
  </g>
  <text x="40" y="304" font-size="12" fill="#5B6770">Три «видео»-блока разные: GPU не декодирует видео,</text>
  <text x="40" y="320" font-size="12" fill="#5B6770">видеодвижок не показывает кадры, дисплей не рисует.</text>

  <!-- память -->
  <rect x="24" y="356" width="852" height="74" rx="10" fill="#FFFFFF" stroke="#22303A" stroke-width="1.5"/>
  <text x="40" y="380" font-size="14" font-weight="700" fill="#22303A">Оперативная память, 1 ГБ (отдельная микросхема на плате)</text>
  <rect x="470" y="388" width="390" height="32" rx="5" fill="#F7EDD8" stroke="#B07A12" stroke-width="1.2"/>
  <text x="665" y="409" font-size="12" fill="#22303A" text-anchor="middle">CMA: непрерывные куски для кадров (глава 9)</text>
  <text x="40" y="410" font-size="12" fill="#5B6770">программы, файлы в кеше, сжатые пакеты</text>
  <line x1="447" y1="282" x2="447" y2="354" stroke="#22303A" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- путь кадра -->
  <text x="24" y="466" font-size="14" font-weight="700" fill="#22303A">Путь кадра при просмотре</text>
  <g font-size="12" fill="#22303A">
    <text x="24" y="492">1. Процессор читает файл и раскладывает пакеты (демультиплексор).</text>
    <text x="24" y="512">2. Видеодвижок берёт сжатые данные и пишет готовый кадр (YUV) в CMA.</text>
    <text x="24" y="532">3. Дисплей забирает кадр из памяти и выводит на HDMI. Если он этот формат не принимает, кадр сначала</text>
    <text x="40" y="550">переводит в RGB GPU (через композитор) или процессор (медленно). Об этом рецепт 0.5 и глава 7.</text>
  </g>
</svg>
