<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22303A"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A83A3A"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#22303A">Шаг плиточного кадра: что ждёт ядро и что ему отдали</text>
  <text x="24" y="58" font-size="13" fill="#5B6770">Второй стенд (A20): кадр 1920x800, NV12 в плитках 32x32 (ST12, модификатор ALLWINNER_TILED)</text>

  <g fill="#E3ECF4" stroke="#34607F" stroke-width="0.8">
    <rect x="24" y="90" width="25" height="25" fill="#F7EDD8" stroke="#B07A12"/><rect x="49" y="90" width="25" height="25"/><rect x="74" y="90" width="25" height="25"/><rect x="99" y="90" width="25" height="25"/><rect x="124" y="90" width="25" height="25"/><rect x="149" y="90" width="25" height="25"/><rect x="174" y="90" width="25" height="25"/><rect x="199" y="90" width="25" height="25"/><rect x="224" y="90" width="25" height="25"/><rect x="249" y="90" width="25" height="25"/><rect x="274" y="90" width="25" height="25"/><rect x="299" y="90" width="25" height="25"/>
    <rect x="24" y="115" width="25" height="25"/><rect x="49" y="115" width="25" height="25"/><rect x="74" y="115" width="25" height="25"/><rect x="99" y="115" width="25" height="25"/><rect x="124" y="115" width="25" height="25"/><rect x="149" y="115" width="25" height="25"/><rect x="174" y="115" width="25" height="25"/><rect x="199" y="115" width="25" height="25"/><rect x="224" y="115" width="25" height="25"/><rect x="249" y="115" width="25" height="25"/><rect x="274" y="115" width="25" height="25"/><rect x="299" y="115" width="25" height="25"/>
    <rect x="24" y="140" width="25" height="25"/><rect x="49" y="140" width="25" height="25"/><rect x="74" y="140" width="25" height="25"/><rect x="99" y="140" width="25" height="25"/><rect x="124" y="140" width="25" height="25"/><rect x="149" y="140" width="25" height="25"/><rect x="174" y="140" width="25" height="25"/><rect x="199" y="140" width="25" height="25"/><rect x="224" y="140" width="25" height="25"/><rect x="249" y="140" width="25" height="25"/><rect x="274" y="140" width="25" height="25"/><rect x="299" y="140" width="25" height="25"/>
    <rect x="24" y="165" width="25" height="25"/><rect x="49" y="165" width="25" height="25"/><rect x="74" y="165" width="25" height="25"/><rect x="99" y="165" width="25" height="25"/><rect x="124" y="165" width="25" height="25"/><rect x="149" y="165" width="25" height="25"/><rect x="174" y="165" width="25" height="25"/><rect x="199" y="165" width="25" height="25"/><rect x="224" y="165" width="25" height="25"/><rect x="249" y="165" width="25" height="25"/><rect x="274" y="165" width="25" height="25"/><rect x="299" y="165" width="25" height="25"/>
    <rect x="24" y="190" width="25" height="25"/><rect x="49" y="190" width="25" height="25"/><rect x="74" y="190" width="25" height="25"/><rect x="99" y="190" width="25" height="25"/><rect x="124" y="190" width="25" height="25"/><rect x="149" y="190" width="25" height="25"/><rect x="174" y="190" width="25" height="25"/><rect x="199" y="190" width="25" height="25"/><rect x="224" y="190" width="25" height="25"/><rect x="249" y="190" width="25" height="25"/><rect x="274" y="190" width="25" height="25"/><rect x="299" y="190" width="25" height="25"/>
  </g>
  <text x="36" y="106" font-size="8" fill="#22303A" text-anchor="middle">32×32</text>
  <text x="24" y="236" font-size="12" fill="#22303A">60 плиток в ряду × 32 пикселя = 1920</text>
  <text x="24" y="254" font-size="12" fill="#22303A">25 рядов × 32 строки = 800</text>
  <text x="24" y="272" font-size="11" fill="#5B6770">(на схеме плиток меньше)</text>

  <rect x="360" y="86" width="270" height="104" rx="6" fill="#F7EDD8" stroke="#B07A12" stroke-width="1.5"/>
  <text x="374" y="108" font-size="13" font-weight="700" fill="#22303A">GStreamer: шаг в GstVideoMeta</text>
  <text x="374" y="130" font-size="12" fill="#22303A" font-family="DejaVu Sans Mono, Liberation Mono, monospace">(y_tiles &lt;&lt; 16) | x_tiles</text>
  <text x="374" y="150" font-size="12" fill="#22303A" font-family="DejaVu Sans Mono, Liberation Mono, monospace">= (25 &lt;&lt; 16) | 60 = 1638460</text>
  <text x="374" y="174" font-size="11" fill="#5B6770">удобно программам, читающим плитки</text>

  <rect x="650" y="86" width="226" height="104" rx="6" fill="#EEF0F2" stroke="#5B6770" stroke-width="1.5"/>
  <text x="664" y="108" font-size="13" font-weight="700" fill="#22303A">kmssink</text>
  <text x="664" y="130" font-size="12" fill="#22303A" font-family="DejaVu Sans Mono, Liberation Mono, monospace">pitches[i] = stride</text>
  <text x="664" y="150" font-size="11" fill="#5B6770">gstkmsallocator.c</text>
  <text x="664" y="174" font-size="11" fill="#5B6770">передаёт число как есть</text>

  <rect x="360" y="212" width="270" height="88" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.5"/>
  <text x="374" y="234" font-size="13" font-weight="700" fill="#22303A">Что ждёт ядро</text>
  <text x="374" y="255" font-size="12" fill="#22303A">pitch = ширина, выровненная до 32:</text>
  <text x="374" y="274" font-size="12" fill="#22303A">1920 байт; столько же отдаёт</text>
  <text x="374" y="291" font-size="12" fill="#22303A">драйвер Cedrus (bytesperline)</text>

  <rect x="650" y="212" width="226" height="88" rx="6" fill="#F6E1E1" stroke="#A83A3A" stroke-width="1.5"/>
  <text x="664" y="234" font-size="13" font-weight="700" fill="#A83A3A">Что получило ядро</text>
  <text x="664" y="256" font-size="12" fill="#22303A">pitch = 1638460</text>
  <text x="664" y="276" font-size="12" fill="#22303A">framebuffer не создан:</text>
  <text x="664" y="293" font-size="12" fill="#A83A3A">Invalid argument (22)</text>

  <line x1="630" y1="138" x2="646" y2="138" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="763" y1="190" x2="763" y2="208" stroke="#A83A3A" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="640" y="320" font-size="12" fill="#A83A3A" text-anchor="middle">должно было быть 1920, а не 1638460</text>

  <rect x="24" y="336" width="852" height="56" rx="6" fill="#EEF0F2" stroke="#5B6770" stroke-width="1.2"/>
  <text x="38" y="358" font-size="11" fill="#22303A" font-family="DejaVu Sans Mono, Liberation Mono, monospace">GEM object size (2334720) smaller than minimum size (1309131460) for plane 0</text>
  <text x="38" y="380" font-size="12" fill="#22303A">минимум = (высота − 1) × pitch + ширина = 799 × 1 638 460 + 1920 = 1 309 131 460 (журнал ядра с drm.debug=0x04)</text>

  <rect x="24" y="404" width="852" height="52" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.6"/>
  <text x="38" y="426" font-size="13" font-weight="700" fill="#22303A">Решение</text>
  <text x="38" y="446" font-size="12" fill="#22303A">Ветка в gstv4l2format.c кладёт в шаг значение драйвера (1920), смещение цветности = 1920 × выровненная высота.</text>
</svg>
