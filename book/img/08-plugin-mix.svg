<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22303A"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#22303A">Подмена системного плагина своим</text>
  <text x="24" y="58" font-size="13" fill="#5B6770">Реестр GStreamer хранит плагины по имени: двойника нужно убрать, а не перекрыть</text>

  <rect x="20" y="74" width="420" height="356" rx="8" fill="#FBF3F3" stroke="#A83A3A" stroke-width="1.4"/>
  <text x="230" y="100" font-size="15" font-weight="700" fill="#22303A" text-anchor="middle">Не сработало: GST_PLUGIN_PATH</text>

  <rect x="40" y="118" width="180" height="62" rx="6" fill="#E3ECF4" stroke="#34607F" stroke-width="1.4"/>
  <text x="130" y="142" font-size="12" fill="#22303A" text-anchor="middle">наша сборка (~/build-gst)</text>
  <text x="130" y="162" font-size="13" font-weight="700" fill="#22303A" text-anchor="middle">v4l2codecs 1.26.11</text>
  <rect x="240" y="118" width="180" height="62" rx="6" fill="#EEF0F2" stroke="#5B6770" stroke-width="1.4"/>
  <text x="330" y="142" font-size="12" fill="#22303A" text-anchor="middle">системная папка плагинов</text>
  <text x="330" y="162" font-size="13" font-weight="700" fill="#22303A" text-anchor="middle">v4l2codecs 1.26.2 и др.</text>

  <line x1="130" y1="180" x2="210" y2="232" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="330" y1="180" x2="250" y2="232" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="160" y="214" font-size="11" fill="#5B6770" text-anchor="end">сканируется первым</text>
  <text x="300" y="214" font-size="11" fill="#5B6770">потом системный путь</text>

  <rect x="130" y="236" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.4"/>
  <text x="230" y="266" font-size="13" fill="#22303A" text-anchor="middle">Реестр плагинов</text>
  <line x1="230" y1="286" x2="230" y2="322" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="60" y="326" width="340" height="62" rx="6" fill="#F6E1E1" stroke="#A83A3A" stroke-width="1.6"/>
  <text x="230" y="352" font-size="13" font-weight="700" fill="#A83A3A" text-anchor="middle">Version 1.26.2</text>
  <text x="230" y="372" font-size="12" fill="#22303A" text-anchor="middle">одноимённый системный вытеснил наш</text>

  <rect x="460" y="74" width="420" height="356" rx="8" fill="#F1F7F3" stroke="#2E6B4F" stroke-width="1.4"/>
  <text x="670" y="100" font-size="15" font-weight="700" fill="#22303A" text-anchor="middle">Сработало: набор ~/gst-mix</text>

  <rect x="480" y="118" width="180" height="62" rx="6" fill="#EEF0F2" stroke="#5B6770" stroke-width="1.4"/>
  <text x="570" y="142" font-size="12" fill="#22303A" text-anchor="middle">системная папка плагинов</text>
  <text x="570" y="162" font-size="12" fill="#22303A" text-anchor="middle">все, кроме v4l2codecs</text>
  <rect x="680" y="118" width="180" height="62" rx="6" fill="#E3ECF4" stroke="#34607F" stroke-width="1.4"/>
  <text x="770" y="142" font-size="12" fill="#22303A" text-anchor="middle">наша сборка (~/build-gst)</text>
  <text x="770" y="162" font-size="13" font-weight="700" fill="#22303A" text-anchor="middle">v4l2codecs 1.26.11</text>

  <line x1="570" y1="180" x2="650" y2="232" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="770" y1="180" x2="690" y2="232" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="598" y="214" font-size="11" fill="#5B6770" text-anchor="end">символьные ссылки</text>
  <text x="742" y="214" font-size="11" fill="#5B6770">ссылка</text>

  <rect x="520" y="236" width="300" height="50" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.6"/>
  <text x="670" y="257" font-size="13" font-weight="700" fill="#22303A" text-anchor="middle">~/gst-mix</text>
  <text x="670" y="276" font-size="11" fill="#22303A" text-anchor="middle" font-family="DejaVu Sans Mono, Liberation Mono, monospace">GST_PLUGIN_SYSTEM_PATH_1_0</text>
  <line x1="670" y1="286" x2="670" y2="322" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="680" y="308" font-size="11" fill="#5B6770">свой реестр: GST_REGISTRY</text>

  <rect x="500" y="326" width="340" height="62" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.6"/>
  <text x="670" y="352" font-size="13" font-weight="700" fill="#2E6B4F" text-anchor="middle">Version 1.26.11</text>
  <text x="670" y="372" font-size="12" fill="#22303A" text-anchor="middle">двойника нет, вытеснять некого</text>

  <text x="24" y="456" font-size="13" fill="#5B6770">После установки любого пакета GStreamer набор нужно пересоздать: в нём только ссылки, сделанные ранее.</text>
</svg>
