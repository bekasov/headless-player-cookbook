<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22303A"/>
    </marker>
  </defs>
  <rect width="900" height="440" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#22303A">Контейнер, потоки и кодеки</text>
  <text x="24" y="58" font-size="13" fill="#5B6770">Контейнер хранит потоки; каждый поток сжат своим кодеком</text>

  <rect x="24" y="80" width="430" height="300" rx="8" fill="#EEF0F2" stroke="#5B6770" stroke-width="1.5"/>
  <text x="40" y="106" font-size="15" font-weight="700" fill="#22303A">Контейнер: MKV, MP4, MPEG-TS</text>
  <text x="40" y="126" font-size="12" fill="#5B6770">метки времени, порядок пакетов, служебные данные</text>

  <rect x="40" y="142" width="398" height="64" rx="5" fill="#E3ECF4" stroke="#34607F" stroke-width="1.5"/>
  <text x="54" y="167" font-size="14" font-weight="700" fill="#22303A">Поток 0: видео</text>
  <text x="54" y="189" font-size="13" fill="#22303A">H.265 (HEVC), Main 10, 1920x1080, 25 к/с</text>

  <rect x="40" y="218" width="398" height="64" rx="5" fill="#F7EDD8" stroke="#B07A12" stroke-width="1.5"/>
  <text x="54" y="243" font-size="14" font-weight="700" fill="#22303A">Поток 1: звук</text>
  <text x="54" y="265" font-size="13" fill="#22303A">AAC, 48 кГц, 2 канала</text>

  <rect x="40" y="294" width="398" height="64" rx="5" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="54" y="319" font-size="14" font-weight="700" fill="#22303A">Поток 2: субтитры (если есть)</text>
  <text x="54" y="341" font-size="13" fill="#22303A">SRT, ASS, PGS</text>

  <line x1="454" y1="231" x2="496" y2="231" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="500" y="191" width="150" height="80" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.5"/>
  <text x="575" y="222" font-size="14" font-weight="700" fill="#22303A" text-anchor="middle">Демультиплексор</text>
  <text x="575" y="244" font-size="12" fill="#5B6770" text-anchor="middle">раскладывает пакеты</text>
  <text x="575" y="260" font-size="12" fill="#5B6770" text-anchor="middle">по потокам</text>

  <line x1="650" y1="214" x2="686" y2="160" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="650" y1="248" x2="686" y2="302" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="690" y="112" width="190" height="84" rx="6" fill="#E3ECF4" stroke="#34607F" stroke-width="1.5"/>
  <text x="785" y="140" font-size="14" font-weight="700" fill="#22303A" text-anchor="middle">Видеодекодер</text>
  <text x="785" y="162" font-size="12" fill="#22303A" text-anchor="middle">аппаратный: Cedrus</text>
  <text x="785" y="180" font-size="12" fill="#5B6770" text-anchor="middle">через v4l2slh265dec</text>

  <rect x="690" y="264" width="190" height="84" rx="6" fill="#F7EDD8" stroke="#B07A12" stroke-width="1.5"/>
  <text x="785" y="292" font-size="14" font-weight="700" fill="#22303A" text-anchor="middle">Аудиодекодер</text>
  <text x="785" y="314" font-size="12" fill="#22303A" text-anchor="middle">на процессоре</text>
  <text x="785" y="332" font-size="12" fill="#5B6770" text-anchor="middle">faad (AAC)</text>

  <text x="24" y="414" font-size="13" fill="#5B6770">Расширение файла говорит о контейнере, а не о кодеке. Смотрите внутрь: ffprobe (глава 2).</text>
</svg>
