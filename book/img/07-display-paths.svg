<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22303A"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#22303A">Три пути кадра на экран</text>
  <text x="24" y="58" font-size="13" fill="#5B6770">Плоскости дисплея принимают только RGB, а декодер выдаёт YUV</text>

  <rect x="20" y="76" width="860" height="104" rx="8" fill="#FBF3F3" stroke="#A83A3A" stroke-width="1.4"/>
  <text x="36" y="100" font-size="14" font-weight="700" fill="#22303A">Напрямую на плоскость (kmssink)</text>
  <rect x="40" y="116" width="150" height="44" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.4"/>
  <text x="115" y="135" font-size="12" fill="#22303A" text-anchor="middle">Декодер</text>
  <text x="115" y="151" font-size="11" fill="#5B6770" text-anchor="middle">NV12, плиточный</text>
  <line x1="190" y1="138" x2="226" y2="138" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="230" y="116" width="330" height="44" rx="6" fill="#F6E1E1" stroke="#A83A3A" stroke-width="1.4"/>
  <text x="395" y="135" font-size="12" fill="#22303A" text-anchor="middle">Плоскости принимают только RGB:</text>
  <text x="395" y="151" font-size="12" fill="#22303A" text-anchor="middle">договориться о формате нельзя</text>
  <line x1="560" y1="138" x2="596" y2="138" stroke="#A83A3A" stroke-width="1.8" stroke-dasharray="5 4"/>
  <path d="M572,130 L584,146 M584,130 L572,146" stroke="#A83A3A" stroke-width="2.2"/>
  <rect x="600" y="116" width="90" height="44" rx="6" fill="#EEF0F2" stroke="#5B6770" stroke-width="1.4"/>
  <text x="645" y="143" font-size="12" fill="#22303A" text-anchor="middle">Экран</text>
  <text x="706" y="134" font-size="13" font-weight="700" fill="#A83A3A">не стартует</text>
  <text x="706" y="152" font-size="11" fill="#5B6770">format UNKNOWN</text>

  <rect x="20" y="196" width="860" height="104" rx="8" fill="#FCF7EC" stroke="#B07A12" stroke-width="1.4"/>
  <text x="36" y="220" font-size="14" font-weight="700" fill="#22303A">Через процессор (videoconvert)</text>
  <rect x="40" y="236" width="150" height="44" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.4"/>
  <text x="115" y="263" font-size="12" fill="#22303A" text-anchor="middle">Декодер</text>
  <line x1="190" y1="258" x2="216" y2="258" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="220" y="236" width="200" height="44" rx="6" fill="#F7EDD8" stroke="#B07A12" stroke-width="1.4"/>
  <text x="320" y="255" font-size="12" fill="#22303A" text-anchor="middle">Процессор читает кадр:</text>
  <text x="320" y="271" font-size="12" fill="#22303A" text-anchor="middle">около 200 мс на кадр</text>
  <line x1="420" y1="258" x2="436" y2="258" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="440" y="236" width="130" height="44" rx="6" fill="#F7EDD8" stroke="#B07A12" stroke-width="1.4"/>
  <text x="505" y="263" font-size="12" fill="#22303A" text-anchor="middle">Перевод в RGB</text>
  <line x1="570" y1="258" x2="596" y2="258" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="600" y="236" width="90" height="44" rx="6" fill="#EEF0F2" stroke="#5B6770" stroke-width="1.4"/>
  <text x="645" y="263" font-size="12" fill="#22303A" text-anchor="middle">Экран</text>
  <text x="706" y="254" font-size="13" font-weight="700" fill="#B07A12">около 5 кадров/с</text>
  <text x="706" y="272" font-size="11" fill="#5B6770">ядро процессора занято</text>

  <rect x="20" y="316" width="860" height="104" rx="8" fill="#F1F7F3" stroke="#2E6B4F" stroke-width="1.4"/>
  <text x="36" y="340" font-size="14" font-weight="700" fill="#22303A">Через GPU (cage и waylandsink)</text>
  <rect x="40" y="356" width="150" height="44" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.4"/>
  <text x="115" y="383" font-size="12" fill="#22303A" text-anchor="middle">Декодер</text>
  <line x1="190" y1="378" x2="226" y2="378" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="208" y="352" font-size="10" fill="#2E6B4F" text-anchor="middle">DMABuf</text>
  <rect x="230" y="356" width="100" height="44" rx="6" fill="#E3ECF4" stroke="#34607F" stroke-width="1.4"/>
  <text x="280" y="375" font-size="12" fill="#22303A" text-anchor="middle">Композитор</text>
  <text x="280" y="391" font-size="11" fill="#5B6770" text-anchor="middle">cage</text>
  <line x1="330" y1="378" x2="346" y2="378" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="350" y="356" width="130" height="44" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.4"/>
  <text x="415" y="375" font-size="12" fill="#22303A" text-anchor="middle">GPU Mali</text>
  <text x="415" y="391" font-size="11" fill="#5B6770" text-anchor="middle">YUV в RGB</text>
  <line x1="480" y1="378" x2="496" y2="378" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="500" y="356" width="76" height="44" rx="6" fill="#E3ECF4" stroke="#34607F" stroke-width="1.4"/>
  <text x="538" y="375" font-size="12" fill="#22303A" text-anchor="middle">Плоскость</text>
  <text x="538" y="391" font-size="11" fill="#5B6770" text-anchor="middle">RGB</text>
  <line x1="576" y1="378" x2="596" y2="378" stroke="#22303A" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="600" y="356" width="90" height="44" rx="6" fill="#EEF0F2" stroke="#5B6770" stroke-width="1.4"/>
  <text x="645" y="383" font-size="12" fill="#22303A" text-anchor="middle">Экран</text>
  <text x="706" y="374" font-size="13" font-weight="700" fill="#2E6B4F">60 кадров/с</text>
  <text x="706" y="392" font-size="11" fill="#5B6770">около трети одного ядра</text>

  <text x="24" y="448" font-size="13" fill="#5B6770">Замеры стенда на H.265 1440x1080@60 (нижний путь) и 1080p (средний путь, предел без привязки к часам).</text>
</svg>
