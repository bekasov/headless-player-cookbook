<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="7" markerHeight="7" orient="0">
      <path d="M0,0 L10,0 L5,10 z" fill="#5B6770"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#22303A">Очередь после декодера: декодер считает вперёд</text>
  <text x="24" y="58" font-size="13" fill="#5B6770">Фильм 1920x800@24 на втором стенде (A20): срок показа кадра каждые 41,7 мс, декодер в среднем ~33 мс на кадр</text>

  <g stroke="#C9D0D6" stroke-width="1" stroke-dasharray="3 3">
    <line x1="220" y1="84" x2="220" y2="340"/><line x1="290" y1="84" x2="290" y2="340"/><line x1="360" y1="84" x2="360" y2="340"/>
    <line x1="430" y1="84" x2="430" y2="340"/><line x1="500" y1="84" x2="500" y2="340"/><line x1="570" y1="84" x2="570" y2="340"/>
    <line x1="640" y1="84" x2="640" y2="340"/><line x1="710" y1="84" x2="710" y2="340"/><line x1="780" y1="84" x2="780" y2="340"/>
    <line x1="850" y1="84" x2="850" y2="340"/>
  </g>
  <text x="220" y="80" font-size="10" fill="#5B6770" text-anchor="middle">срок</text>
  <text x="290" y="80" font-size="10" fill="#5B6770" text-anchor="middle">срок</text>
  <text x="360" y="80" font-size="10" fill="#5B6770" text-anchor="middle">срок</text>
  <text x="430" y="80" font-size="10" fill="#5B6770" text-anchor="middle">срок</text>

  <text x="24" y="108" font-size="13" font-weight="700" fill="#22303A">Без очереди</text>
  <text x="24" y="126" font-size="12" fill="#5B6770">один поток:</text>
  <text x="24" y="142" font-size="12" fill="#5B6770">декодер ждёт,</text>
  <text x="24" y="158" font-size="12" fill="#5B6770">пока экран ждёт</text>
  <g stroke-width="1.2">
    <rect x="160" y="110" width="48" height="34" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="208" y="110" width="12" height="34" fill="#EEF0F2" stroke="#5B6770"/>
    <rect x="220" y="110" width="48" height="34" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="268" y="110" width="22" height="34" fill="#EEF0F2" stroke="#5B6770"/>
    <rect x="290" y="110" width="110" height="34" fill="#F6E1E1" stroke="#A83A3A"/>
    <rect x="400" y="110" width="48" height="34" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="448" y="110" width="52" height="34" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="500" y="110" width="48" height="34" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="548" y="110" width="22" height="34" fill="#EEF0F2" stroke="#5B6770"/>
    <rect x="570" y="110" width="48" height="34" fill="#E3ECF4" stroke="#34607F"/>
  </g>
  <text x="345" y="132" font-size="11" fill="#A83A3A" text-anchor="middle">тяжёлый кадр</text>
  <text x="430" y="166" font-size="12" fill="#A83A3A" text-anchor="middle">опоздал</text>
  <text x="474" y="166" font-size="12" fill="#A83A3A">и следующий тоже</text>
  <text x="160" y="184" font-size="11" fill="#5B6770">синий: декодирование; серый: ожидание срока показа в том же потоке</text>

  <text x="24" y="206" font-size="13" font-weight="700" fill="#22303A">С очередью</text>
  <text x="120" y="206" font-size="12" fill="#5B6770">два потока: декодер идёт на несколько кадров впереди экрана</text>
  <text x="152" y="230" font-size="11" fill="#22303A" text-anchor="end">декодер</text>
  <g stroke-width="1.2">
    <rect x="160" y="216" width="48" height="26" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="208" y="216" width="48" height="26" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="256" y="216" width="110" height="26" fill="#F6E1E1" stroke="#A83A3A"/>
    <rect x="366" y="216" width="48" height="26" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="414" y="216" width="52" height="26" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="466" y="216" width="48" height="26" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="514" y="216" width="48" height="26" fill="#E3ECF4" stroke="#34607F"/>
    <rect x="562" y="216" width="48" height="26" fill="#E3ECF4" stroke="#34607F"/>
  </g>
  <text x="311" y="234" font-size="11" fill="#A83A3A" text-anchor="middle">тяжёлый кадр</text>
  <text x="152" y="270" font-size="11" fill="#22303A" text-anchor="end">очередь</text>
  <rect x="160" y="256" width="690" height="22" rx="4" fill="#F7EDD8" stroke="#B07A12" stroke-width="1.2"/>
  <text x="505" y="272" font-size="11" fill="#22303A" text-anchor="middle">queue max-size-buffers=4: готовые кадры ждут своего срока</text>
  <text x="152" y="312" font-size="11" fill="#22303A" text-anchor="end">экран</text>
  <g stroke-width="1.2" fill="#E4EFE8" stroke="#2E6B4F">
    <rect x="214" y="298" width="12" height="26"/><rect x="284" y="298" width="12" height="26"/><rect x="354" y="298" width="12" height="26"/>
    <rect x="424" y="298" width="12" height="26"/><rect x="494" y="298" width="12" height="26"/><rect x="564" y="298" width="12" height="26"/>
    <rect x="634" y="298" width="12" height="26"/><rect x="704" y="298" width="12" height="26"/><rect x="774" y="298" width="12" height="26"/>
    <rect x="844" y="298" width="12" height="26"/>
  </g>
  <text x="505" y="340" font-size="12" fill="#2E6B4F" text-anchor="middle">каждый кадр показан в свой срок: тяжёлый кадр съел запас, а не время показа</text>

  <rect x="24" y="360" width="852" height="94" rx="6" fill="#E4EFE8" stroke="#2E6B4F" stroke-width="1.6"/>
  <text x="40" y="384" font-size="14" font-weight="700" fill="#22303A">Замер (рецепт 11.8)</text>
  <text x="40" y="406" font-size="13" fill="#22303A">Без очереди: медиана +1,1 мс, p99 +103,8 мс, максимум +118,5 мс; позже 40 мс пришли 55 кадров из 585.</text>
  <text x="40" y="426" font-size="13" fill="#22303A">С очередью на 4 кадра: медиана −31,5 мс, p99 −22,2 мс, максимум +2,0 мс; позже 40 мс ни одного из 582.</text>
  <text x="40" y="446" font-size="13" fill="#22303A">Цена: минимум свободной CMA ниже примерно на 14 МБ (54,7 → 40,2 МБ). Масштаб времени условный.</text>
</svg>
